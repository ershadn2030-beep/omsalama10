<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إشعار درجات الفصل الدراسي - مدرسة أم سلمة الخيرية (9 مواد)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Amiri:wght@400;700&family=Cairo:wght@700;800&family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@600;700;800&family=Scheherazade+New:wght@700&family=Tajawal:wght@700;800&display=swap');

        :root {
            --cert-font: 'Traditional Arabic', 'Amiri', 'Noto Naskh Arabic', serif;
            --title-gap: 6px;
            --table-gap: 14px;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Noto Sans Arabic', 'Cairo', Arial, sans-serif;
            background-color: #cbd5e1;
            margin: 0;
            padding: 12px;
            color: #000000;
        }

        /* شريط التجربة التفاعلي السريع */
        .quick-toolbar {
            max-width: 210mm;
            margin: 0 auto 12px auto;
            background: #1e293b;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            font-size: 12.5px;
        }

        .font-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .q-btn {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 6px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            transition: 0.15s;
        }

        .q-btn:hover, .q-btn.active {
            background: #10b981;
            border-color: #059669;
            color: #fff;
        }

        /* ================= شاشة الدخول ================= */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #13392d 0%, #1e5241 100%);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .login-box {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 14px;
            width: 380px;
            max-width: 92%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .login-box img { max-width: 140px; margin-bottom: 10px; }
        .login-box h2 { margin: 0 0 8px 0; color: #1e5241; font-size: 20px; font-weight: 800; }
        .login-box p { margin: 0 0 20px 0; color: #666; font-size: 13px; }
        .login-box input {
            width: 100%; padding: 11px; border: 2px solid #cbd5e1; border-radius: 8px;
            font-family: inherit; font-size: 15px; text-align: center; margin-bottom: 15px;
        }
        .login-box button {
            width: 100%; padding: 11px; background: #1e5241; color: #fff; border: none;
            border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
        }
        .login-err { color: #d90429; font-size: 12px; font-weight: 700; margin-top: 10px; display: none; }

        /* ================= لوحة الإدخال ================= */
        .dashboard {
            max-width: 210mm;
            margin: 0 auto 18px auto;
            background: #ffffff;
            padding: 18px 22px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 5px solid #1e5241;
        }

        .dash-title {
            margin: 0 0 12px 0;
            color: #1e5241;
            font-size: 16px;
            font-weight: 800;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sec-bar {
            font-size: 12.5px;
            font-weight: 700;
            color: #1e5241;
            background: #eff6f3;
            padding: 6px 10px;
            border-right: 4px solid #1e5241;
            margin: 12px 0 8px 0;
            border-radius: 4px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 8px;
        }

        .inp-group { display: flex; flex-direction: column; }
        .inp-group label { font-size: 11px; font-weight: 700; margin-bottom: 3px; color: #1e293b; }
        .inp-group input, .inp-group select {
            padding: 6px 9px; border: 1px solid #cbd5e1; border-radius: 6px;
            font-family: inherit; font-size: 12px; background: #fff; font-weight: 700;
        }

        .btns-row {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            padding: 9px 16px; border: none; border-radius: 7px; font-family: inherit;
            font-weight: 700; font-size: 12.5px; cursor: pointer; color: #fff;
        }
        .btn-add { background: #1e5241; }
        .btn-prv { background: #d97706; }
        .btn-print { background: #0284c7; }
        .btn-clear { background: #e11d48; margin-right: auto; }

        /* =========================================================================
           ورقة الشهادة الرسمية (مطابقة 100% للورقة المطبوعة في الصورة الأخيرة)
        ========================================================================= */
        .pages-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            overflow-x: auto;
        }

        .cert-page {
            width: 210mm;
            min-width: 210mm;
            height: 297mm;
            background: #ffffff;
            padding: 14mm 15mm 12mm 15mm;
            margin: 0 auto;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            position: relative;
            font-family: var(--cert-font);
            direction: rtl;
            page-break-after: always;
            break-after: page;
            color: #000000;
        }

        .cert-page:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        /* 1. الترويسة العلوية بنفس أحجام ومسافات الورقة المطبوعة */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2px;
        }

        .hdr-right {
            width: 34%;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.5;
            padding-top: 2px;
        }

        /* رمز (رضي الله عنها) المربع المزخرف المطابق للورقة المطبوعة */
        .rad-symbol {
            display: inline-block;
            vertical-align: middle;
            width: 22px;
            height: 21px;
            margin: 0 1px;
            position: relative;
            top: -2px;
        }

        .rad-symbol svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hdr-center {
            width: 36%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* حجم الشعار مطابق للورقة المطبوعة تماماً */
        .logo-box {
            width: 118px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hdr-left {
            width: 30%;
        }

        /* العناوين الوسطى تحت الشعار */
        .center-titles {
            text-align: center;
            margin-top: var(--title-gap);
            margin-bottom: var(--table-gap);
        }

        .center-titles .title-ar {
            font-size: 17.5px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .center-titles .title-en {
            font-family: Calibri, Arial, sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.2px;
            margin-bottom: 6px;
        }

        .center-titles .grade-ar {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .center-titles .grade-en {
            font-family: Calibri, Arial, sans-serif;
            font-size: 12.5px;
            font-weight: 700;
        }

        /* 2. الجدول الأول (المربع الرمادي المقسم بـ 8 أعمدة مطابقة للورقة المطبوعة) */
        table.info-tbl {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            table-layout: fixed;
            border: 1.2px solid #000000;
        }

        table.info-tbl td {
            border: 1px solid #000000;
            background-color: #d9d9d9 !important;
            padding: 2px 5px;
            text-align: center;
            vertical-align: middle;
            font-size: 15.5px;
            font-weight: 700;
            height: 23px;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
        }

        .en-txt {
            font-family: Calibri, Arial, sans-serif;
            font-size: 12px;
            font-weight: 700;
            direction: ltr;
        }

        /* 3. جدول المواد الدراسية (9 مواد) + السلوك والمواظبة المدموجة في الأسفل */
        table.marks-tbl {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 18px;
            table-layout: fixed;
            border: 1.2px solid #000000;
        }

        table.marks-tbl th, table.marks-tbl td {
            border: 1px solid #000000;
            padding: 1px 6px;
            text-align: center;
            vertical-align: middle;
            font-size: 16px;
            font-weight: 700;
            height: 23px;
            line-height: 1.1;
        }

        table.marks-tbl th {
            background-color: #d9d9d9 !important;
            height: 25px;
            font-size: 15.5px;
            font-weight: 700;
        }

        table.marks-tbl th.en-th {
            font-family: Calibri, Arial, sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            direction: ltr;
        }

        .en-sub-cell {
            font-family: Calibri, Arial, sans-serif;
            font-size: 12px !important;
            font-weight: 700 !important;
            direction: ltr;
        }

        .num-cell {
            font-size: 15.5px !important;
            font-weight: 700 !important;
        }

        /* دمج السلوك والمواظبة كما في الورقة المطبوعة */
        .merged-conduct-label {
            padding: 1px 42px 1px 28px !important;
        }

        .merged-conduct-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* 4. منطقة التوقيعات والختم */
        .sigs-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 22px;
            margin-top: 8px;
            margin-bottom: 18px;
        }

        .sig-right-col { width: 35%; text-align: center; }
        .sig-mid-col { width: 30%; text-align: center; padding-top: 6px; font-size: 16px; font-weight: 700; }
        .sig-left-col { width: 35%; text-align: center; padding-top: 6px; }

        .sig-block-ar { font-size: 16px; font-weight: 700; line-height: 1.25; }
        .sig-block-en { font-family: Calibri, Arial, sans-serif; font-size: 12px; font-weight: 700; margin-top: 3px; }
        .sig-val-name { margin-top: 6px; font-size: 16px; font-weight: 700; min-height: 20px; }
        .principal-box { margin-top: 14px; }

        /* 5. شرح المستويات في أسفل الورقة (مطابق للورقة المطبوعة تماماً) */
        .levels-footer {
            width: 100%;
            margin-top: 8px;
            padding: 0 2px;
        }

        .levels-head-right {
            text-align: right;
            font-size: 15.5px;
            font-weight: 700;
            margin-bottom: 6px;
            direction: rtl;
        }

        .levels-head-right .und-ar {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .levels-head-right .en-lvl {
            font-family: Calibri, Arial, sans-serif;
            font-size: 13px;
            font-weight: 700;
            margin-right: 8px;
            direction: ltr;
            display: inline-block;
        }

        .levels-head-right .und-en {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .lvl-item-ar {
            text-align: right;
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 2px;
        }

        .lvl-item-en {
            text-align: left;
            direction: ltr;
            font-family: Calibri, Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .del-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e11d48;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        @media print {
            @page { size: A4 portrait; margin: 0; }
            body { background: #ffffff; padding: 0; margin: 0; }
            .no-print, .quick-toolbar, #loginOverlay, .dashboard, .del-btn { display: none !important; }
            .pages-wrapper { gap: 0; overflow: visible; }
            .cert-page { box-shadow: none; margin: 0; width: 210mm; height: 297mm; }
        }
    </style>
</head>
<body>

<!-- شريط تبديل الخطوط التفاعلي السريع -->
<div class="quick-toolbar no-print">
    <div class="font-btns">
        <span>🔤 الخط:</span>
        <button class="q-btn active" onclick="setFont(this, `'Traditional Arabic', 'Amiri', 'Noto Naskh Arabic', serif`)">1. خط الورقة الأصلي (Traditional Arabic)</button>
        <button class="q-btn" onclick="setFont(this, `'Noto Naskh Arabic', 'Arial', sans-serif`)">2. خط النسخ (Noto Naskh)</button>
        <button class="q-btn" onclick="setFont(this, `'Noto Sans Arabic', 'Arial', sans-serif`)">3. خط صريح (Sans)</button>
        <button class="q-btn" onclick="setFont(this, `'Almarai', sans-serif`)">4. المراعي</button>
    </div>
    <div class="font-btns">
        <button class="q-btn" style="background:#0284c7;" onclick="toggleDash()">📝 إظهار/إخفاء خانات التسجيل</button>
        <button class="q-btn" style="background:#10b981;" onclick="window.print()">🖨️ حفظ PDF / طباعة</button>
    </div>
</div>

<!-- شاشة القفل -->
<div id="loginOverlay" class="no-print">
    <div class="login-box">
        <img class="embedded-logo-img" alt="شعار المدرسة">
        <h2>مدرسة أم سلمة الخيرية</h2>
        <p>يرجى إدخال كلمة المرور للدخول للنظام</p>
        <input type="password" id="passInput" placeholder="كلمة المرور..." onkeypress="if(event.key==='Enter') verifyLogin()">
        <button onclick="verifyLogin()">دخول</button>
        <div class="login-err" id="loginErr">كلمة المرور غير صحيحة!</div>
    </div>
</div>

<!-- لوحة الإدخال -->
<div class="dashboard no-print" id="dashPanel">
    <div class="dash-title">
        <span>تسجيل بيانات الطالبات (نسخة الـ 9 مواد المطابقة للورقة المطبوعة)</span>
        <span style="font-size:13px; color:#1e5241;">عدد الشهادات: <b id="stuCounter">1</b></span>
    </div>

    <div class="sec-bar">1. الشعار وبيانات الصف والإدارة</div>
    <div class="grid-inputs">
        <div class="inp-group">
            <label>📷 رفع ملف الشعار (PDF أو صورة)</label>
            <input type="file" accept="application/pdf,image/*" onchange="uploadSchoolLogo(event)">
        </div>
        <div class="inp-group">
            <label>نظام المواد</label>
            <select id="presetMode" onchange="changePresetMode(this.value)">
                <option value="9">9 مواد (شاملة الإنجليزي - بدون اجتماعيات)</option>
                <option value="8">8 مواد (الصفوف الأولية)</option>
            </select>
        </div>
        <div class="inp-group">
            <label>عنوان الإشعار</label>
            <input type="text" id="hdrTitleAr" value="إشعار بدرجات الفصل الدراسي الأول للعام 1448 هـ">
        </div>
        <div class="inp-group">
            <label>الصف الدراسي (عربي)</label>
            <input type="text" id="hdrGradeAr" value="الخامس الابتدائي" oninput="autoTranslateGrade(this.value)">
        </div>
        <div class="inp-group">
            <label>الصف الدراسي (إنجليزي)</label>
            <input type="text" id="hdrGradeEn" value="The Fifth Primary School" dir="ltr">
        </div>
        <div class="inp-group">
            <label>رائدة الفصل</label>
            <input type="text" id="hdrCoord" value="أفنان زكريا عبد المعبود">
        </div>
        <div class="inp-group">
            <label>مديرة المدرسة</label>
            <input type="text" id="hdrPrincipal" value="فريدة محمد الأحمدي">
        </div>
    </div>

    <div class="sec-bar">2. البيانات الأساسية للطالبة (المربع الأول)</div>
    <div class="grid-inputs">
        <div class="inp-group">
            <label>اسم الطالبة (عربي)</label>
            <input type="text" id="inName" placeholder="خديجة أولى مياه محمد فرايا">
        </div>
        <div class="inp-group">
            <label>Student Name (إنجليزي)</label>
            <input type="text" id="inNameEn" placeholder="kadejah ula meyah" dir="ltr">
        </div>
        <div class="inp-group">
            <label>الفصل (Class)</label>
            <input type="text" id="inClass" value="1">
        </div>
        <div class="inp-group">
            <label>تاريخ الميلاد</label>
            <input type="text" id="inDob" placeholder="2007">
        </div>
        <div class="inp-group">
            <label>الجنسية (عربي)</label>
            <input type="text" id="inNatAr" value="برماوية">
        </div>
        <div class="inp-group">
            <label>Nationality (إنجليزي)</label>
            <input type="text" id="inNatEn" value="Burma" dir="ltr">
        </div>
        <div class="inp-group">
            <label>رقم الهوية (Identity No)</label>
            <input type="text" id="inId" placeholder="2257148607">
        </div>
        <div class="inp-group">
            <label>ولي أمر الطالبة</label>
            <input type="text" id="inParent" placeholder="أولى مياه محمد فرايا">
        </div>
    </div>

    <div class="sec-bar">3. التقدير لكل مادة (9 مواد) والسلوك والمواظبة</div>
    <div class="grid-inputs" id="subsContainer"></div>

    <div class="grid-inputs" style="margin-top:8px;">
        <div class="inp-group">
            <label>السلوك (Conduct)</label>
            <input type="text" id="inConduct" value="متعاونة">
        </div>
        <div class="inp-group">
            <label>المواظبة (Attendance)</label>
            <input type="text" id="inAttend" value="مواظبة">
        </div>
    </div>

    <div class="btns-row">
        <button class="btn btn-add" onclick="addStudentRecord()">➕ إضافة الطالبة</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ تصدير PDF / طباعة</button>
        <button class="btn btn-clear" onclick="clearAllRecords()">🗑️ مسح الكل</button>
    </div>
</div>

<!-- حاوية الشهادات -->
<div class="pages-wrapper" id="certsWrapper"></div>

<script>

    // تحويل الأرقام إلى الأرقام العربية الشرقية (١ ٢ ٣) لعمود التسلسل وتاريخ الميلاد العربي كما في الورقة
    function toEasternDigits(str) {
        if (str === null || str === undefined) return '';
        const eastern = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return String(str).replace(/[0-9]/g, w => eastern[+w]);
    }

    function toWesternDigits(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    async function uploadSchoolLogo(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.type === 'application/pdf') {
            const ab = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
            const page = await pdf.getPage(1);
            const vp = page.getViewport({ scale: 2.0 });
            const c = document.createElement('canvas');
            c.width = vp.width; c.height = vp.height;
            const ctx = c.getContext('2d');
            await page.render({ canvasContext: ctx, viewport: vp }).promise;

            const imgData = ctx.getImageData(0, 0, c.width, c.height);
            const d = imgData.data;
            let top = c.height, left = c.width, right = 0, bottom = 0;
            for (let y = 0; y < c.height; y++) {
                for (let x = 0; x < c.width; x++) {
                    const i = (y * c.width + x) * 4;
                    if (d[i] < 245 || d[i+1] < 245 || d[i+2] < 245) {
                        if (x < left) left = x;
                        if (x > right) right = x;
                        if (y < top) top = y;
                        if (y > bottom) bottom = y;
                    }
                }
            }
            const pad = 12;
            left = Math.max(0, left - pad); top = Math.max(0, top - pad);
            right = Math.min(c.width, right + pad); bottom = Math.min(c.height, bottom + pad);
            const out = document.createElement('canvas');
            out.width = 450; out.height = Math.round((bottom - top) * (450 / (right - left)));
            out.getContext('2d').drawImage(c, left, top, right - left, bottom - top, 0, 0, out.width, out.height);
            activeLogo = out.toDataURL('image/jpeg', 0.92);
            localStorage.setItem('ums_custom_logo', activeLogo);
            renderAllPages();
        } else {
            const reader = new FileReader();
            reader.onload = ev => {
                activeLogo = ev.target.result;
                localStorage.setItem('ums_custom_logo', activeLogo);
                renderAllPages();
            };
            reader.readAsDataURL(file);
        }
    }
